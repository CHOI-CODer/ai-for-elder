<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef8f4" />
    <meta name="description" content="AI 健康助手在线对话页面" />
    <title>AI 健康助手</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #12372f;
        --muted: #5b746d;
        --brand: #1b8067;
        --brand-dark: #12634f;
        --surface: rgba(255, 255, 255, 0.88);
        --line: rgba(18, 99, 79, 0.14);
        --shadow: 0 28px 80px rgba(21, 82, 68, 0.15);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow-x: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 14%, rgba(111, 216, 176, 0.28), transparent 34rem),
          radial-gradient(circle at 88% 82%, rgba(141, 195, 255, 0.24), transparent 30rem),
          #f4faf7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: linear-gradient(rgba(27, 128, 103, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(27, 128, 103, 0.035) 1px, transparent 1px);
        background-size: 32px 32px;
        content: "";
        mask-image: linear-gradient(to bottom, black, transparent 90%);
      }

      .page {
        width: min(1120px, calc(100% - 32px));
        min-height: 100vh;
        margin: 0 auto;
        padding: max(24px, env(safe-area-inset-top)) 0 max(28px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 28px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 19px;
        font-weight: 750;
        letter-spacing: -0.02em;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        color: #fff;
        background: linear-gradient(145deg, #2aa783, #12634f);
        box-shadow: 0 10px 24px rgba(27, 128, 103, 0.24);
        font-size: 24px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 13px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.7);
        color: var(--muted);
        font-size: 13px;
        backdrop-filter: blur(12px);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3cbf84;
        box-shadow: 0 0 0 4px rgba(60, 191, 132, 0.14);
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(380px, 1.08fr);
        align-items: center;
        gap: clamp(32px, 7vw, 96px);
      }

      .intro {
        padding: 28px 0;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 18px;
        color: var(--brand-dark);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .eyebrow::before {
        width: 26px;
        height: 2px;
        border-radius: 2px;
        background: var(--brand);
        content: "";
      }

      h1 {
        max-width: 620px;
        margin: 0;
        font-size: clamp(42px, 6.4vw, 76px);
        line-height: 1.04;
        letter-spacing: -0.055em;
      }

      h1 span {
        color: var(--brand);
      }

      .lead {
        max-width: 540px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: clamp(17px, 2vw, 20px);
        line-height: 1.75;
      }

      .benefits {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 30px 0 0;
        padding: 0;
        list-style: none;
      }

      .benefits li {
        padding: 10px 13px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.62);
        color: #315f54;
        font-size: 14px;
      }

      .chat-launcher {
        position: relative;
        min-height: 500px;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 32px;
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(22px);
      }

      .chat-launcher::before,
      .chat-launcher::after {
        position: absolute;
        border-radius: 50%;
        content: "";
        filter: blur(1px);
      }

      .chat-launcher::before {
        width: 260px;
        height: 260px;
        top: -100px;
        right: -70px;
        background: rgba(95, 205, 169, 0.18);
      }

      .chat-launcher::after {
        width: 220px;
        height: 220px;
        bottom: -100px;
        left: -80px;
        background: rgba(114, 171, 233, 0.15);
      }

      .launch-content {
        position: relative;
        z-index: 1;
        width: min(360px, calc(100% - 44px));
        text-align: center;
      }

      .orb {
        width: 112px;
        height: 112px;
        margin: 0 auto 26px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 38px;
        color: white;
        background: linear-gradient(145deg, #55c49d, #19775f);
        box-shadow: 0 24px 50px rgba(27, 128, 103, 0.28), inset 0 1px rgba(255, 255, 255, 0.5);
        font-size: 48px;
        transform: rotate(-3deg);
      }

      .launch-title {
        margin: 0;
        font-size: 25px;
        letter-spacing: -0.03em;
      }

      .launch-description {
        margin: 13px 0 24px;
        color: var(--muted);
        line-height: 1.65;
      }

      .start-button {
        width: 100%;
        min-height: 54px;
        border: 0;
        border-radius: 16px;
        color: #fff;
        background: var(--brand);
        box-shadow: 0 14px 30px rgba(27, 128, 103, 0.22);
        font: inherit;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      .start-button:hover {
        background: var(--brand-dark);
        box-shadow: 0 16px 36px rgba(27, 128, 103, 0.3);
        transform: translateY(-2px);
      }

      .start-button:focus-visible {
        outline: 3px solid rgba(27, 128, 103, 0.25);
        outline-offset: 4px;
      }

      .start-button:disabled {
        cursor: wait;
        opacity: 0.72;
        transform: none;
      }

      .error {
        display: none;
        margin: 16px 0 0;
        padding: 11px 13px;
        border-radius: 12px;
        color: #9f2d28;
        background: #fff0ef;
        font-size: 14px;
        line-height: 1.5;
      }

      .error.show {
        display: block;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        color: #71857f;
        font-size: 12px;
        line-height: 1.55;
      }

      footer p {
        max-width: 680px;
        margin: 0;
      }

      @media (max-width: 820px) {
        .page {
          width: min(100% - 24px, 620px);
          gap: 20px;
        }

        main {
          grid-template-columns: 1fr;
          gap: 22px;
        }

        .intro {
          padding: 30px 4px 8px;
        }

        h1 {
          font-size: clamp(42px, 13vw, 62px);
        }

        .chat-launcher {
          min-height: 410px;
          border-radius: 26px;
        }

        footer {
          flex-direction: column;
          gap: 6px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header aria-label="页面顶部">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✚</span> AI 健康助手</div>
        <div class="status"><span class="status-dot" aria-hidden="true"></span> 在线服务</div>
      </header>

      <main>
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">智能健康咨询</p>
          <h1 id="page-title">有问题，<br /><span>随时聊一聊</span></h1>
          <p class="lead">通过文字或语音说出您的疑问，AI 助手会用容易理解的方式陪您一起梳理。</p>
          <ul class="benefits" aria-label="功能特点">
            <li>简单易用</li>
            <li>随时对话</li>
            <li>电脑手机都能用</li>
          </ul>
        </section>

        <section class="chat-launcher" aria-labelledby="chat-title">
          <div class="launch-content">
            <div class="orb" aria-hidden="true">♡</div>
            <h2 class="launch-title" id="chat-title">开始一次新对话</h2>
            <p class="launch-description" id="launch-description">对话助手准备就绪，点击下方按钮即可打开。</p>
            <button class="start-button" id="start-chat" type="button" aria-describedby="launch-description">打开 AI 对话</button>
            <p class="error" id="error" role="alert"></p>
          </div>
        </section>
      </main>

      <footer>
        <p>AI 回答仅供信息参考，不替代专业医疗诊断。如出现严重或紧急症状，请及时就医或联系当地急救服务。</p>
        <span>Powered by Coze</span>
      </footer>
    </div>

    <script src="./config.js"></script>
    <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.19/libs/cn/index.js"></script>
    <script>
      ;(function setupChat() {
        const button = document.getElementById('start-chat')
        const error = document.getElementById('error')
        let client = null
        let initializing = false

        const showError = function (message) {
          error.textContent = message
          error.classList.add('show')
        }

        const clearError = function () {
          error.textContent = ''
          error.classList.remove('show')
        }

        const getToken = async function () {
          const config = window.COZE_CHAT_CONFIG
          const response = await fetch(config.tokenEndpoint, {
            method: 'GET',
            credentials: 'same-origin',
            headers: { Accept: 'application/json' }
          })

          if (!response.ok) {
            const detail = await response.json().catch(function () { return {} })
            throw new Error(detail.message || '暂时无法获取对话凭证')
          }

          const result = await response.json()
          if (!result.token) {
            throw new Error('对话凭证无效')
          }
          return result.token
        }

        const openChat = async function () {
          if (initializing) return
          clearError()

          try {
            if (client) {
              client.showChatBot()
              return
            }

            const config = window.COZE_CHAT_CONFIG
            if (!config || !config.botId || !config.tokenEndpoint) {
              throw new Error('页面配置不完整')
            }
            if (!window.CozeWebSDK || !window.CozeWebSDK.WebChatClient) {
              throw new Error('对话服务加载失败，请检查网络后重试')
            }

            initializing = true
            button.disabled = true
            button.textContent = '正在连接…'
            const token = await getToken()

            client = new window.CozeWebSDK.WebChatClient({
              config: { bot_id: config.botId },
              componentProps: { title: config.title || 'AI 健康助手' },
              auth: {
                type: 'token',
                token: token,
                onRefreshToken: getToken
              }
            })

            client.showChatBot()
            button.textContent = '重新打开对话'
          } catch (cause) {
            showError(cause && cause.message ? cause.message : '暂时无法打开对话')
            button.textContent = '重试'
            console.error(cause)
          } finally {
            initializing = false
            button.disabled = false
          }
        }

        button.addEventListener('click', openChat)
        window.addEventListener('load', function () {
          window.setTimeout(openChat, 350)
        })
      })()
    </script>
  </body>
</html>
